<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Minjung's Scheduler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <aside class="sidebar">

        <div class="profile-card">
            <div class="avatar">M</div>
            <div>
                <p>Hello, Minjung</p>
                <h2 id="monthTitle"></h2>
            </div>
        </div>

        <section class="box">
            <h3>오늘 일정</h3>
            <div class="today-rate">
                <strong id="todayRate">0%</strong>
                <span>오늘 완료율</span>
            </div>
            <ul id="todayList"></ul>
        </section>

        <section class="box">
            <h3>이번 달 목표</h3>

            <div class="goal-form">
                <input id="goalInput" placeholder="목표 입력">
                <button id="addGoalBtn">+</button>
            </div>

            <ul id="goalList"></ul>
        </section>

        <section class="box">
            <h3>메모</h3>
            <textarea id="memoInput" placeholder="메모를 입력하세요"></textarea>
        </section>

    </aside>

    <main class="main">

        <header class="top">
            <button id="prevBtn">‹</button>

            <div>
                <p>Monthly Planner</p>
                <h1 contenteditable="true">📅 Minjung's Scheduler</h1>
            </div>

            <button id="nextBtn">›</button>
        </header>

        <section class="dashboard">
            <div class="card point">
                <span>Progress</span>
                <strong id="rate">0%</strong>
            </div>

            <div class="card">
                <span>Total</span>
                <strong id="totalCount">0</strong>
            </div>

            <div class="card">
                <span>Done</span>
                <strong id="doneCount">0</strong>
            </div>

            <div class="card">
                <span>Remain</span>
                <strong id="remainCount">0</strong>
            </div>
        </section>

        <section class="input-area">
            <input id="taskInput" placeholder="병원 / 회사 / 외근 일정 입력">
            <input id="dateInput" type="date">
            <select id="categoryInput"></select>
            <button id="categoryBtn">카테고리</button>
            <button id="addTaskBtn">추가</button>
        </section>

        <div class="weekdays">
            <div>SUN</div>
            <div>MON</div>
            <div>TUE</div>
            <div>WED</div>
            <div>THU</div>
            <div>FRI</div>
            <div>SAT</div>
        </div>

        <div id="calendar" class="calendar"></div>

    </main>

</div>

<!-- 일정 수정 모달 -->
<div id="taskModal" class="modal hidden">
    <div class="modal-box">
        <h2>일정 수정</h2>

        <input id="editText" placeholder="일정 내용">
        <input id="editDate" type="date">
        <select id="editCategory"></select>

        <div class="modal-buttons">
            <button id="deleteTaskBtn" class="danger">삭제</button>
            <button id="closeTaskBtn">닫기</button>
            <button id="saveTaskBtn">저장</button>
        </div>
    </div>
</div>

<!-- 카테고리 관리 모달 -->
<div id="categoryModal" class="modal hidden">
    <div class="modal-box category-modal-box">
        <h2>카테고리 관리</h2>

        <div id="categoryList" class="category-list"></div>

        <button id="addCategoryBtn" class="add-category-btn">
            + 카테고리 추가
        </button>

        <div class="modal-buttons two">
            <button id="closeCategoryBtn">닫기</button>
            <button id="saveCategoryBtn">저장</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
