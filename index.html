<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Minjung's Scheduler</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <aside class="sidebar">

        <div class="profile-card">
            <div class="avatar">M</div>
            <div>
                <p>Hello, Minjung</p>
                <h2 id="monthTitle"></h2>
            </div>
        </div>

        <section class="box today-box">
            <h3>오늘 일정</h3>
            <ul id="todayList"></ul>
            <div class="today-progress-footer">
                <strong>오늘 완료율 <span id="todayRate">0%</span></strong>
                <div class="today-progress"><div id="todayProgressFill"></div></div>
            </div>
        </section>

        <section class="box legend-box">
            <div class="box-title-row">
                <h3>색상 안내</h3>
                <button id="legendEditBtn" class="title-add-btn" title="카테고리 수정">✎</button>
            </div>
            <div id="legendList" class="legend-list"></div>
        </section>

        <section class="box selected-day-box">
            <div class="box-title-row">
                <h3 id="selectedDayTitle">선택한 날짜</h3>
                <button id="selectedDayAddBtn" class="title-add-btn">+</button>
            </div>
            <div id="selectedDayList" class="selected-day-list"></div>
        </section>

    </aside>

    <main class="main">

        <header class="top">
            <button id="prevBtn">‹</button>

            <div>
                <p>Monthly Planner</p>
                <h1 contenteditable="true">📅 Minjung's Scheduler</h1>
            </div>

            <button id="nextBtn">›</button>
        </header>

        <section class="dashboard">
            <div class="card point">
                <span>Progress</span>
                <strong id="rate">0%</strong>
            </div>

            <div class="card">
                <span>Total</span>
                <strong id="totalCount">0</strong>
            </div>

            <div class="card">
                <span>Done</span>
                <strong id="doneCount">0</strong>
            </div>

            <div class="card">
                <span>Remain</span>
                <strong id="remainCount">0</strong>
            </div>
        </section>

        <section class="input-area">
            <input id="taskInput" placeholder="일정 또는 메모 입력">
            <input id="dateInput" type="date">
            <select id="typeInput">
                <option value="task">일정</option>
                <option value="memo">메모</option>
            </select>
            <select id="categoryInput"></select>
            <button id="categoryBtn">카테고리</button>
            <button id="addTaskBtn">추가</button>
        </section>

        <div class="weekdays">
            <div>SUN</div>
            <div>MON</div>
            <div>TUE</div>
            <div>WED</div>
            <div>THU</div>
            <div>FRI</div>
            <div>SAT</div>
        </div>

        <div id="calendar" class="calendar"></div>

    </main>

</div>

<!-- 일정 수정 모달 -->
<div id="taskModal" class="modal hidden">
    <div class="modal-box">
        <h2>일정 수정</h2>

        <input id="editText" placeholder="일정 내용">
        <input id="editDate" type="date">
        <select id="editType">
            <option value="task">일정</option>
            <option value="memo">메모</option>
        </select>
        <select id="editCategory"></select>

        <div class="modal-buttons">
            <button id="deleteTaskBtn" class="danger">삭제</button>
            <button id="closeTaskBtn">닫기</button>
            <button id="saveTaskBtn">저장</button>
        </div>
    </div>
</div>

<!-- 카테고리 관리 모달 -->
<div id="categoryModal" class="modal hidden">
    <div class="modal-box category-modal-box">
        <h2>카테고리 관리</h2>

        <div id="categoryList" class="category-list"></div>

        <button id="addCategoryBtn" class="add-category-btn">
            + 카테고리 추가
        </button>

        <div class="modal-buttons two">
            <button id="closeCategoryBtn">닫기</button>
            <button id="saveCategoryBtn">저장</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
